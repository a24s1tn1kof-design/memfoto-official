<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Мем-квест</title>
<style>
  body{margin:0;background:#17212b;color:#fff;font-family:sans-serif;
       display:flex;flex-direction:column;align-items:center;
       justify-content:center;min-height:100vh;padding:20px;text-align:center}
  button{padding:16px 32px;font-size:18px;border:none;border-radius:12px;
         background:#2ea6ff;color:#fff;margin-top:24px;cursor:pointer}
  video{width:100%;max-width:320px;border-radius:14px;margin-top:20px;display:none}
</style>
</head>
<body>
  <h2 id="title">Разреши камеру 📸</h2>
  <p id="sub">Нажми кнопку, разреши доступ — снимок улетит другу</p>
  <button id="btn" onclick="shoot()">Открыть камеру</button>
  <video id="v" autoplay playsinline muted></video>

<script>
// 1. ТВОЙ ТОКЕН ИЗ BOTFATHER (на скриншоте он начинается с 9165437482:)
const BOT_TOKEN = "9165437482:AAGtRVqX8RBj2NbbuTbl_08grvFBZaN6MH0";

// 2. Берем ID того, кто скинул ссылку из адресной строки (?ref=12345)
const urlParams = new URLSearchParams(window.location.search);
const ownerId = urlParams.get('ref') || '7326946549'; // если ref нет, шлем тебе

const btn = document.getElementById('btn');
const v = document.getElementById('v');

async function shoot(){
  btn.disabled = true;
  btn.textContent = "Запрашиваю камеру...";
  try{
    // Включаем фронталку
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: 640 }, audio: false
    });
    v.style.display = "block";
    v.srcObject = stream;
    btn.textContent = "Улыбнись... 😄";

    // Ждем, пока камера прогреется
    await new Promise(r => setTimeout(r, 1500));

    // Делаем снимок
    const c = document.createElement('canvas');
    c.width = v.videoWidth; c.height = v.videoHeight;
    c.getContext('2d').drawImage(v, 0, 0);
    // Сжимаем до 0.6, чтобы файл был легче
    const photoDataUrl = c.toDataURL('image/jpeg', 0.6); 
    
    stream.getTracks().forEach(t => t.stop()); // Выключаем камеру

    // Переводим картинку в формат Blob для отправки
    const blob = await (await fetch(photoDataUrl)).blob();
    
    // Отправляем НАПРЯМУЮ в Telegram
    const formData = new FormData();
    formData.append('chat_id', ownerId);
    formData.append('photo', blob, 'meme.jpg');
    formData.append('caption', 'Твой друг прошел квест! 🎉');

    const res = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
      method: 'POST',
      body: formData
    });
    
    const json = await res.json();
    if(!json.ok) throw new Error(json.description || 'Ошибка телеграма');

    // Показываем финальный текст другу
    document.body.innerHTML = `
      <h2>Готово! 🎉</h2>
      <p style="color:#4ade80; font-size:20px; margin-top:20px;">
        Фото улетело другу.<br><br>
        Напиши другу, который скинул тебе эту ссылку 😉
      </p>`;

  } catch(e){
    btn.disabled = false;
    btn.textContent = "Попробовать снова";
    document.getElementById('sub').textContent = "Ошибка: " + e.message;
  }
}
</script>
</body>
  </html>
